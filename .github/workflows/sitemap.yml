name: Weekly Sitemap Generation

on:
  # schedule:
  #   - cron: '0 9 * * 1'  # Every Monday at 9 AM UTC
  workflow_dispatch:  # Allow manual trigger

jobs:
  sitemap:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Generate Prisma client
        run: npm run prisma:generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          
      - name: Generate and submit sitemap
        run: npm run sitemap:submit
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          
      - name: Comment on success
        if: success()
        run: |
          echo "✅ Sitemap generated and submitted successfully!"
          echo "🌐 Sitemap URL: https://www.mtgmods.xyz/sitemap.xml"
          echo "📅 Next run: Monday at 9 AM UTC"
          
      - name: Comment on failure
        if: failure()
        run: |
          echo "❌ Sitemap generation failed!"
          echo "🔍 Check the logs above for details" 